name: Build and Push Docker Image

on:
  workflow_dispatch:            # Allows manually triggering the workflow from the GitHub Actions page
    inputs:
      extra_tag:
        description: 'Additional Docker tag to publish (optional, e.g. testing)'
        required: false
        default: ''

  push:
    branches: [main]            # every push to main refreshes the :latest tag
    tags:
      - 'v*.*.*'                # pushing a tag matching the pattern vX.X.X (e.g., v1.2.3)

concurrency:
  # Keyed by event as well as ref: a manual run must not cancel the push build
  # of the same commit, which is what made pushes show up as "canceled".
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read              # Repository contents
      packages: write             # GitHub Packages, including ghcr.io

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m compileall -q main.py web_gui.py audible_epub3_maker

      # The amd64 image pulls in ~4GB of NVIDIA CUDA libraries via torch, which
      # is more than a stock runner has spare. Reclaim the pre-installed
      # toolchains we do not use.
      - name: Free up runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Tag the image with the app's own version, so a push to main publishes
      # e.g. :1.1.0 alongside :latest with no separate manual run needed.
      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' audible_epub3_maker/utils/constants.py)
          echo "App version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without a cache, every run rebuilds the ~3.3GB pip layer from scratch.
      # Its contents are identical but the tarball is not byte-for-byte, so it
      # gets a fresh digest each build and every client re-pulls all of it.
      # Reusing the cache keeps unchanged layers bit-identical, so an app-only
      # change is a ~1MB pull. Stored as a separate tag in the same registry
      # (the GitHub Actions cache would not hold a layer this size).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
